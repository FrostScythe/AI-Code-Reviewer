# Application
spring.application.name=aicodereview
server.port=9095

# Database
# createDatabaseIfNotExist=true means no manual DB creation needed
spring.datasource.url=jdbc:mysql://localhost:3306/code_reviewer_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
# update = auto-creates / alters tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.transaction.coordinator_class=jdbc
spring.jpa.show-sql=false

# Google Gemini API
# Set this environment variable before running:
#   Windows: $env:API_KEY="your_key"
#   Mac/Linux: export API_KEY=your_key
google.api.key=${API_KEY}